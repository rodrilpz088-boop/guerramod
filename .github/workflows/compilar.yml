name: Compilar mod

on:
  push:
    paths-ignore:
      - 'descarga/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compilar
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: guerramod-jar
          path: build/libs/*.jar
      - name: Guardar el .jar en la carpeta descarga
        run: |
          mkdir -p descarga
          cp build/libs/guerramod-*.jar descarga/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add descarga
          git commit -m "Mod compilado [skip ci]" || echo "sin cambios"
          git push
